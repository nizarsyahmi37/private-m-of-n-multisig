[package]
name = "private_multisig_cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nizarsyahmi37/private-m-of-n-multisig"
rust-version = "1.80"
publish = false

# This crate is intentionally NOT a workspace member of the project root —
# `spel::run()` transitively pulls in the LEZ sequencer client stack, which
# has a hard build-time prerequisite on `logos-blockchain-circuits` v0.4.2
# being on disk. The empty `[workspace]` table prevents Cargo from walking
# up and inheriting the parent workspace.
[workspace]

[[bin]]
name = "pmsig"
path = "src/main.rs"

[dependencies]
# SPEL ships a generic IDL-driven CLI as a library. `spel::run()` parses
# the IDL JSON declared in `spel.toml`, derives subcommands from each
# `#[instruction]` handler, computes PDAs from `pda = [...]` annotations,
# serializes args via risc0 wire format, and submits via `sequencer_service_rpc`.
# This single dep gives us the entire CLI surface for 5 of the 6 handlers
# (see `src/main.rs` for the `approve` deferral).
# Pinned by `rev` (SPEL v0.3.0 SHA at the time of this commit) rather
# than `tag = "v0.3.0"` — upstream tags are mutable; we observed v0.3.0
# move once already.
spel = { git = "https://github.com/logos-co/spel", rev = "84f50d4aa473a70b72a16a7fb468c5618277cdd7" }

# Required for `#[tokio::main]` — spel::run() is async. Features kept
# minimal: `rt-multi-thread` to spawn a runtime, `macros` for the
# `#[tokio::main]` attribute. `net`/`sync` are pulled in transitively
# by `spel::run()`'s sequencer client; declaring them here would be
# redundant and would commit us to a wider surface than we use.
# Version is a caret on 1 so cargo can unify with `spel`'s own tokio
# pin without forcing a downgrade.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
