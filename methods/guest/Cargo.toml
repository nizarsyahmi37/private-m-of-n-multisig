[package]
name = "approve_circuit_guest"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

# This crate is intentionally NOT a workspace member of the project root —
# it builds under the Risc0 RISC-V toolchain managed by `cargo-risczero`.
# `risc0-build` invokes its own cargo on this directory from
# `methods/build.rs`. The empty `[workspace]` table below prevents Cargo
# from walking up and picking the parent workspace.
[workspace]

[[bin]]
name = "approve_circuit"
path = "src/bin/approve_circuit.rs"

[[bin]]
name = "private_multisig"
path = "src/bin/private_multisig.rs"

[dependencies]
# Pinned tight to match `risc0-zkvm = "=3.0.5"` in the SDK and `risc0-build
# = "=3.0.5"` in `methods/Cargo.toml`; bumping any one of these requires
# bumping all three together and regenerating the pinned image-id.
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
# The approve_circuit guest uses only the no_std-safe subset of `crypto` and
# `private_multisig_core`. The SPEL verifier needs the full `std` surface
# (state types, validators, derive helpers). Cargo unifies features within a
# single crate's dep table, so both binaries see the std-enabled API. The
# approve_circuit's ELF dead-code-eliminates anything it doesn't import.
crypto = { path = "../../crypto" }
private_multisig_core = { path = "../../private_multisig_core" }
spel-framework = { git = "https://github.com/logos-co/spel", rev = "84f50d4aa473a70b72a16a7fb468c5618277cdd7" }
# `nssa_core` is intentionally still tag-pinned: SPEL v0.3.0 declares its
# own transitive `nssa_core = { tag = "v0.2.0-rc3" }`, and Cargo unifies
# git deps by URL+pin form, not by resolved SHA. Pinning by `rev` here
# would split the dep tree into two `nssa_core` instances with
# incompatible types (`spel_framework::prelude::AccountId` vs
# `nssa_core::account::AccountId`). Unifies once SPEL upstream switches
# to `rev` itself; tracked alongside the SPEL bump checklist.
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc3" }
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
