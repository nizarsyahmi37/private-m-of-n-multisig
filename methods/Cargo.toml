[package]
name = "methods"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
# Pinned tight to match `risc0-zkvm = "=3.0.5"` in the SDK and the guest;
# bumping any one of these requires bumping all three together and
# regenerating the pinned image-id.
risc0-build = "=3.0.5"

[package.metadata.risc0]
methods = ["guest"]
