# cargo-deny configuration for LP-0002 Private M-of-N Multisig.
#
# Guards three classes of supply-chain risk:
# 1. `advisories`: any dep with an open RustSec advisory fails CI.
# 2. `licenses`: only MIT / Apache-2.0 / BSD-style licenses (the prize
#    requires MIT or Apache-2.0 for our own code; we accept BSD-class
#    licenses on transitive deps).
# 3. `sources`: deps must come from crates.io OR a small allowlist of
#    git sources (SPEL, logos-execution-zone) we already pull from.
#
# To run locally:
#   cargo install --locked cargo-deny
#   cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# SPDX identifiers we accept on direct or transitive deps.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
]
# Confidence threshold for unclear license texts.
confidence-threshold = 0.93

[bans]
# Allow multiple major versions of the same crate while the ecosystem
# settles (the Risc0 toolchain pulls in older versions of common crates).
# Set to "deny" once duplicates are reviewed.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# URLs must match exactly what `Cargo.toml` declares (cargo-deny is
# string-strict, not URL-canonical). SPEL is referenced without `.git`,
# logos-execution-zone with `.git` — both forms are kept verbatim.
allow-git = [
    "https://github.com/logos-co/spel",
    "https://github.com/logos-blockchain/logos-execution-zone.git",
]
