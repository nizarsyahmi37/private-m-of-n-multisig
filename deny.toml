# cargo-deny configuration for LP-0002 Private M-of-N Multisig.
#
# Guards three classes of supply-chain risk:
# 1. `advisories`: any dep with an open RustSec advisory fails CI.
# 2. `licenses`: only MIT / Apache-2.0 / BSD-style licenses (the prize
#    requires MIT or Apache-2.0 for our own code; we accept BSD-class
#    licenses on transitive deps).
# 3. `sources`: deps must come from crates.io OR a small allowlist of
#    git sources (SPEL, logos-execution-zone) we already pull from.
#
# To run locally:
#   cargo install --locked cargo-deny
#   cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every ignore here is a transitive dep with no safe upgrade in the current
# Risc0 (3.0.5) or sled (0.34.7) graph. Revisit on every Risc0 bump and on
# the planned sled → redb migration; drop the corresponding entry as soon
# as the underlying crate is gone from the graph.
ignore = [
    # Marvin timing attack on RSA decryption. `rsa 0.9` has no fix
    # available; pulled in via Risc0's Groth16 verifier chain (we don't
    # use RSA for any private-multisig logic).
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.x has no fix; only used by Risc0 transitively, not by our crypto" },
    # Tracing's ansi-escape log poisoning. Transitive through Risc0's
    # observability stack; the SDK does not emit untrusted text into log
    # messages.
    { id = "RUSTSEC-2025-0055", reason = "tracing transitive via risc0-zkvm; SDK does not log untrusted text" },
    # bincode 1.3.3 is the only stable major as of this writing; switching
    # to wincode/postcard requires reworking our Receipt persistence and
    # Risc0's own usage. Tracked as a follow-on.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x has no actively-maintained drop-in replacement; planned migration with Receipt persistence rework" },
    # `derivative` is unmaintained but pulled in only by ark-* via
    # Risc0's Groth16 path; no behavioural impact.
    { id = "RUSTSEC-2024-0388", reason = "derivative is transitive via risc0-groth16 → ark-crypto-primitives; no derive macros we author" },
    # `paste` archived by author; transitive through Risc0 macro plumbing.
    { id = "RUSTSEC-2024-0436", reason = "paste archived but stable; transitive via risc0-zkvm macros" },
    # `instant` and `fxhash` come exclusively from `sled 0.34`; both will
    # disappear when the SDK migrates off sled.
    { id = "RUSTSEC-2024-0384", reason = "instant transitive via sled 0.34 → parking_lot; gone once we migrate the session store" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash transitive via sled 0.34; gone once we migrate the session store" },
]

[licenses]
version = 2
# SPDX identifiers we accept on direct or transitive deps.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # webpki-roots 1.x switched from MPL-2.0 to CDLA-Permissive-2.0;
    # transitive via Risc0 → bonsai-sdk → reqwest → rustls.
    "CDLA-Permissive-2.0",
]
# Confidence threshold for unclear license texts.
confidence-threshold = 0.93

[bans]
# Allow multiple major versions of the same crate while the ecosystem
# settles (the Risc0 toolchain pulls in older versions of common crates).
# Set to "deny" once duplicates are reviewed.
multiple-versions = "warn"
# Reject `crate = "*"` in published deps but accept it for in-workspace
# path-dep cross-references like `crypto = { path = "..." }`.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# URLs must match exactly what `Cargo.toml` declares (cargo-deny is
# string-strict, not URL-canonical). SPEL is referenced without `.git`,
# logos-execution-zone with `.git` — both forms are kept verbatim.
allow-git = [
    "https://github.com/logos-co/spel",
    "https://github.com/logos-blockchain/logos-execution-zone.git",
]
