# cargo-deny configuration for LP-0002 Private M-of-N Multisig.
#
# Guards three classes of supply-chain risk:
# 1. `advisories`: any dep with an open RustSec advisory fails CI.
# 2. `licenses`: only MIT / Apache-2.0 / BSD-style licenses (the prize
#    requires MIT or Apache-2.0 for our own code; we accept BSD-class
#    licenses on transitive deps).
# 3. `sources`: deps must come from crates.io OR a small allowlist of
#    git sources (SPEL, logos-execution-zone) we already pull from.
#
# To run locally:
#   cargo install --locked cargo-deny
#   cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every ignore here is either a transitive dep with no safe upgrade in the
# current Risc0 (3.0.5) or sled (0.34.7) graph, or a direct dep flagged as
# unmaintained (bincode 1.x) that we deliberately pin until a coordinated
# migration. Full advisory text at https://rustsec.org/advisories/<id>.html.
# Revisit on every Risc0 bump and on the planned sled → redb migration;
# drop the corresponding entry as soon as the underlying crate is gone.
ignore = [
    # Marvin timing attack on RSA decryption. `rsa 0.9` has no fix.
    # Pulled in transitively via `rzup` (the Risc0 toolchain installer that
    # ships with `risc0-build` / `risc0-zkvm`); RSA is used only for the
    # installer's signed-manifest verification at build-time, not by
    # `risc0-groth16` or anything on our runtime path.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.x has no fix; transitive via rzup installer at build-time only, never decrypts attacker-controlled ciphertext at runtime" },
    # Tracing's ansi-escape log poisoning. Transitive through Risc0's
    # observability stack; the SDK does not emit untrusted text into log
    # messages.
    { id = "RUSTSEC-2025-0055", reason = "tracing transitive via risc0-zkvm; SDK does not log untrusted text" },
    # bincode 1.3.3 is a DIRECT dep — `sdk/src/prover.rs` uses
    # `bincode::serialize(&receipt)` to persist Risc0 receipts in the
    # resumable session store. The advisory flags bincode 1.x as
    # unmaintained (not vulnerable), and the receipt bytes we decode are
    # our own output rather than adversary input. bincode 2.x exists but
    # diverges from the bincode-1 derives Risc0's `Receipt` ships with.
    # Tracked as a follow-on alongside the Receipt persistence rework.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x used directly in sdk/prover.rs for Receipt persistence; unmaintained but not vulnerable, no drop-in replacement available; planned migration with the Receipt persistence rework" },
    # `derivative` is unmaintained but pulled in only by ark-* via
    # Risc0's Groth16 path; no behavioural impact.
    { id = "RUSTSEC-2024-0388", reason = "derivative is transitive via risc0-groth16 → ark-crypto-primitives; no derive macros we author" },
    # `paste` archived by author; transitive through Risc0 macro plumbing.
    { id = "RUSTSEC-2024-0436", reason = "paste archived but stable; transitive via risc0-zkvm macros" },
    # `instant` and `fxhash` come exclusively from `sled 0.34`; both will
    # disappear when the SDK migrates off sled.
    { id = "RUSTSEC-2024-0384", reason = "instant transitive via sled 0.34 → parking_lot; gone once we migrate the session store" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash transitive via sled 0.34; gone once we migrate the session store" },
]

[licenses]
version = 2
# SPDX identifiers we accept on direct or transitive deps.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # webpki-roots 1.x switched from MPL-2.0 to CDLA-Permissive-2.0;
    # transitive via Risc0 → bonsai-sdk → reqwest → rustls.
    "CDLA-Permissive-2.0",
]
# Confidence threshold for unclear license texts.
confidence-threshold = 0.93

# SPEL v0.3.0's per-crate `Cargo.toml` files don't declare a `license`
# field even though the workspace ships both `LICENSE-MIT` and
# `LICENSE-APACHE-v2` at the repo root. These clarify blocks tell
# cargo-deny that the three SPEL crates we pull in are dual-licensed
# under MIT OR Apache-2.0, matching the upstream LICENSE files. Drop
# these once SPEL adds the `license` field to its manifests upstream.
# cargo-deny 0.19.7 `[[licenses.clarify]]` schema accepts only `crate`,
# `expression`, and `license-files`. There is no `version` key, so the
# clarify scope cannot be narrowed to "spel-framework = 0.3.0" alone —
# any crate named `spel-framework` at any version would match. Two
# guardrails compensate:
#
#  1. `[sources] allow-git` (below) whitelists only `logos-co/spel`,
#     so a same-name crate from a different source is rejected at the
#     source check before reaching the licenses check.
#  2. SPEL is pinned by SHA in every `Cargo.toml` git dep (round 7
#     `b4f7e97`), so a future maintainer cannot silently float the
#     version without an explicit rev bump that re-triggers review.
#
# Drop these blocks once SPEL upstream adds the `license` field to its
# manifests.
[[licenses.clarify]]
crate = "spel-framework"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "spel-framework-core"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "spel-framework-macros"
expression = "MIT OR Apache-2.0"
license-files = []

[bans]
# Allow multiple major versions of the same crate while the ecosystem
# settles (the Risc0 toolchain pulls in older versions of common crates).
# Set to "deny" once duplicates are reviewed.
multiple-versions = "warn"
# Reject `crate = "*"` in published deps but accept it for in-workspace
# path-dep cross-references like `crypto = { path = "..." }`.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# URLs must match exactly what `Cargo.toml` declares (cargo-deny is
# string-strict, not URL-canonical). SPEL is referenced without `.git`,
# logos-execution-zone with `.git` — both forms are kept verbatim.
allow-git = [
    "https://github.com/logos-co/spel",
    "https://github.com/logos-blockchain/logos-execution-zone.git",
]
