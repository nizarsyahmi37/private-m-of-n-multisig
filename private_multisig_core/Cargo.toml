[package]
name = "private_multisig_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
# `std` pulls in the full host-side surface: `MultisigState`, `Proposal`,
# `NullifierEntry`, `Vault`, the `Instruction` enum, PDA derivation helpers,
# `CoreError`, and the threshold / action-bytes validators. Without `std`,
# only the guest-required subset is reachable: `ApprovePublicInputs`,
# `ChainId`, `derive_proposal_id`, and the `APPROVE_PUBLIC_INPUTS_LEN`
# constant.
std = ["crypto/std", "dep:thiserror"]

[dependencies]
crypto = { path = "../crypto", default-features = false }
borsh = { workspace = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true }
rand = { workspace = true }
criterion = "0.5"

[[bench]]
name = "core_bench"
harness = false
