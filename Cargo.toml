[workspace]
resolver = "2"
members = [
    "crypto",
    "private_multisig_core",
    "methods",
    "private_multisig_program",
    "sdk",
    "idl-gen",
]
# `methods/guest/` builds under the Risc0-managed RISC-V toolchain;
# `risc0-build` invokes its own cargo over it from `methods/build.rs`.
# `cli/` is excluded because the LEZ sequencer client stack (`nssa`,
# `sequencer_service_rpc`, `wallet`) it pulls in via `spel::run()` has a
# hard build-time prerequisite on the `logos-blockchain-circuits` v0.4.2
# release being available at `~/.logos-blockchain-circuits/` or via
# `LOGOS_BLOCKCHAIN_CIRCUITS`. Building the CLI requires that prereq;
# excluding it from the host workspace lets `cargo build --workspace`
# work for contributors who only touch the core/sdk/program crates.
exclude = ["methods/guest", "cli"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nizarsyahmi37/private-m-of-n-multisig"
rust-version = "1.80"
# Workspace members are not published to crates.io; this lets `cargo deny`
# treat the inter-crate `path = ...` deps as private wildcards rather than
# rejecting them as public-crate wildcards.
publish = false

[workspace.dependencies]
sha2 = { version = "0.10", default-features = false }
rand = "0.8"
hex = "0.4"
thiserror = "1"
borsh = { version = "1", default-features = false, features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
