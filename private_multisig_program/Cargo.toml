[package]
name = "private_multisig_program"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
methods = { path = "../methods" }
crypto = { path = "../crypto" }
private_multisig_core = { path = "../private_multisig_core" }
# Pinned tight to match `=3.0.5` in the SDK, methods, and methods/guest;
# bumping any of these requires regenerating the image-id pin in
# `sdk/src/lib.rs::APPROVE_CIRCUIT_IMAGE_ID_PINNED`.
risc0-zkvm = "=3.0.5"
borsh = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
rand = { workspace = true }
spel-framework = { git = "https://github.com/logos-co/spel", rev = "84f50d4aa473a70b72a16a7fb468c5618277cdd7" }
# `nssa_core` stays on `tag = "v0.2.0-rc3"` to unify with SPEL's
# transitive pin (Cargo splits the dep tree on URL+pin form, not on
# resolved SHA). Detailed rationale in `methods/guest/Cargo.toml`.
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc4" }
