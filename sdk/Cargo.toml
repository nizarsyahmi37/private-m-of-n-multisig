[package]
name = "private_multisig_sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["std"]
# `std` enables everything (including Risc0 proving if the prover feature is
# also enabled). Without `std`, only Member, IdentityCommitment, and builder
# types compile.
std = ["dep:risc0-zkvm", "dep:bincode"]
# `prover` gates the Risc0 proving module. Requires the Risc0 toolchain
# to be installed and network access for artifact download. Enable explicitly:
# `cargo build -p private_multisig_sdk --features prover`
prover = ["dep:risc0-zkvm", "dep:bincode"]

[dependencies]
# Cryptographic core (Merkle, nullifier, identity commitment)
crypto = { path = "../crypto", default-features = false }

# Shared types: Instruction, state, PDA derivation, ApprovePublicInputs
private_multisig_core = { path = "../private_multisig_core" }

# Zero-knowledge proof generation (gated behind the `prover` feature)
# When enabled, this pulls in the full Risc0 host (ExecutorEnv, default_prover).
# Without `prover`, this crate compiles without Risc0 — useful for type-checking
# and testing the member/builder/session modules.
# Version pinned tightly (=3.0.5) — bumping requires regenerating the image-id
# pin and reviewing any prover-API drift.
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["client"], optional = true }

# Receipt serialization for resumable session persistence. Receipts are not
# Borsh-friendly (they come from Risc0 with serde derives), so we use bincode
# for the on-disk encoding of `ApprovalSession::receipt`.
bincode = { version = "1.3", optional = true }

# Secret management: wraps sk in SecretBox<T>, auto-Zeroize on drop. The
# 0.10 release renamed `Secret<T>` → `SecretBox<T>` and now requires a
# `Box::new(value)` at construction (the inner secret is heap-stored so
# zeroize can scrub the actual memory the secret lived in, not a copy
# left on the stack).
secrecy = "0.10"

# Local key-value store for resumable ApprovalSession persistence
sled = "0.34"

# Password-based key derivation + AEAD for keystore encryption
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }

# Error types
thiserror = { workspace = true }

# Serialization for wire and storage formats
borsh = { workspace = true }

# Randomness for key and salt generation
rand = { workspace = true }

# Platform-specific home directory lookup
dirs = "6"

[dev-dependencies]
tempfile = "3"

# Used by tests/image_id_pin_parity.rs to verify the SDK's locally-pinned
# image-id stays in lockstep with the canonical one re-exported by
# private_multisig_program. Pulling this in only at test time keeps the
# methods crate (and its Risc0 guest build) off the regular SDK build path.
private_multisig_program = { path = "../private_multisig_program" }
