name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # RISC0_DEV_MODE produces fast but non-SNARK receipts. Required for CI
  # because real proving takes minutes per receipt. PLAN.md §Verification
  # step 7 calls out a nightly job for the RISC0_DEV_MODE=0 path.
  RISC0_DEV_MODE: "1"
  # Pin the Risc0 rust toolchain so the guest builds reproducibly. Bumping
  # this changes the compiled ELF and therefore the image-id, so
  # `sdk/src/lib.rs::APPROVE_CIRCUIT_IMAGE_ID_PINNED` must be regenerated
  # in lockstep — `sdk/tests/image_id_pin_parity.rs` enforces that.
  RISC0_TOOLCHAIN_VERSION: "1.94.1"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned by SHA (latest `master` at the time of this commit); `@master`
      # would float. `dtolnay/rust-toolchain` does not publish version tags
      # past `v1`, so SHA is the only reliable pinning option.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27 ("Add 1.94.1 patch release")
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      # The `methods` crate's build.rs invokes `risc0_build::embed_methods()`,
      # which requires the Risc0 RISC-V toolchain. `rzup` is fetched via
      # `cargo install` (using crates.io's HTTPS + checksum integrity rather
      # than a piped `curl` from risczero.com) and installed into
      # ~/.cargo/bin, which the rust-toolchain step already added to PATH.
      # Cold compile is ~3 minutes; 10 minutes is 3x headroom and bounds the
      # damage if rzup or any of its transitive deps becomes unfetchable
      # mid-PR. Without this, the default 6-hour GitHub timeout applies.
      - name: Install rzup
        timeout-minutes: 10
        run: cargo install --locked --version 0.5.1 rzup

      - name: Install Risc0 rust toolchain
        timeout-minutes: 10
        run: rzup install rust "$RISC0_TOOLCHAIN_VERSION"

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny all warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      - name: Build SDK with prover feature
        run: cargo build -p private_multisig_sdk --features prover

      - name: Test SDK with prover feature
        run: cargo test -p private_multisig_sdk --features prover

  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # `cargo deny check` runs the same RustSec advisory DB as `cargo audit`
      # plus licenses, sources, and bans — one tool, one config (`deny.toml`).
      - name: Check advisories, licenses, sources, and bans
        uses: EmbarkStudios/cargo-deny-action@d8395c1c8c9df74d968a3bcbba5533e396ff43cf # v2.0.9
