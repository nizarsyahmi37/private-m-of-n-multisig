name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # RISC0_DEV_MODE produces fast but non-SNARK receipts. Required for CI
  # because real proving takes minutes per receipt. PLAN.md §Verification
  # step 7 calls out a nightly job for the RISC0_DEV_MODE=0 path.
  RISC0_DEV_MODE: "1"
  # Pin the Risc0 toolchain version so `cargo risczero install` is
  # deterministic and a passive Risc0 release doesn't change CI behavior.
  RISC0_TOOLCHAIN_VERSION: "1.85.0"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `@master` respects `rust-toolchain.toml`; `@stable` ignores it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The `methods` crate's build.rs invokes `risc0_build::embed_methods()`,
      # which requires the Risc0 RISC-V toolchain. Without this the workspace
      # build itself fails.
      - name: Install Risc0 toolchain
        run: |
          cargo install --version 1.4.0 cargo-risczero
          cargo risczero install --version "$RISC0_TOOLCHAIN_VERSION"

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny all warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      - name: Build SDK with prover feature
        run: cargo build -p private_multisig_sdk --features prover

      - name: Test SDK with prover feature
        run: cargo test -p private_multisig_sdk --features prover

  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pre-built actions avoid a several-minute `cargo install` per PR.
      - name: Audit dependencies for known vulnerabilities
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check licenses, sources, and advisories
        uses: EmbarkStudios/cargo-deny-action@v2
