name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow-level default: the GITHUB_TOKEN handed to every job is scoped
# down to read-only repository contents. Dependabot PRs (and any future
# fork PRs) cannot exfiltrate or mutate via a malicious build-script
# even if a secret is later added to the workflow env. Jobs that need
# more (e.g. posting comments, writing checks) must opt in explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # RISC0_DEV_MODE produces fast but non-SNARK receipts. Required for CI
  # because real proving takes minutes per receipt. PLAN.md §Verification
  # step 7 calls out a nightly job for the RISC0_DEV_MODE=0 path.
  RISC0_DEV_MODE: "1"
  # Pin the Risc0 rust toolchain so the guest builds reproducibly. Bumping
  # this changes the compiled ELF and therefore the image-id, so
  # `sdk/src/lib.rs::APPROVE_CIRCUIT_IMAGE_ID_PINNED` must be regenerated
  # in lockstep — `sdk/tests/image_id_pin_parity.rs` enforces that. With
  # Docker reproducible builds enabled below the host-side toolchain is
  # unused at compile time, but rzup still installs it for the r0vm host
  # path (used by ExternalProver at test time).
  RISC0_TOOLCHAIN_VERSION: "1.94.1"
  # Build the Risc0 guest binaries inside the pinned
  # `risczero/risc0-guest-builder` container so the resulting image-id is
  # host-independent. Without this, image-ids drift between e.g. macOS dev
  # machines and Linux CI runners, and the on-chain ABI sentinels in
  # `private_multisig_program/tests/image_id_stability.rs`,
  # `blue_team_program_v3.rs`, `blue_team_program_v4.rs`,
  # `red_team_program_v3.rs`, and `sdk/tests/image_id_pin_parity.rs`
  # fail noisily. The reproducible-build mode is consumed by
  # `methods/build.rs` and reflected in
  # `methods::BUILD_USED_DOCKER`, which gates the pin assertions.
  RISC0_USE_DOCKER: "1"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    # Job-level ceiling. Reproducible Docker guest builds add a one-time
    # image pull (~1–2 GB) plus an in-container `cargo fetch` + cross-compile
    # of the guest. Cold path is ~20–30 minutes; 60 minutes covers it with
    # headroom and still caps a hung Docker / cargo / r0vm run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pinned by SHA (latest `master` at the time of this commit); `@master`
      # would float. `dtolnay/rust-toolchain` does not publish version tags
      # past `v1`, so SHA is the only reliable pinning option.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27 ("Add 1.94.1 patch release")
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The `methods` crate's build.rs invokes `risc0_build::embed_methods()`,
      # which requires the Risc0 RISC-V toolchain. `rzup` is fetched via
      # `cargo install` (using crates.io's HTTPS + checksum integrity rather
      # than a piped `curl` from risczero.com) and installed into
      # ~/.cargo/bin, which the rust-toolchain step already added to PATH.
      # Cold compile is ~3 minutes; 10 minutes is 3x headroom and bounds the
      # damage if rzup or any of its transitive deps becomes unfetchable
      # mid-PR. Without this, the default 6-hour GitHub timeout applies.
      - name: Install rzup
        timeout-minutes: 10
        run: cargo install --locked --version 0.5.1 rzup

      - name: Install Risc0 rust toolchain
        timeout-minutes: 10
        run: rzup install rust "$RISC0_TOOLCHAIN_VERSION"

      # The proving tests call `risc0_zkvm::default_prover()`, which (without
      # the heavy native `prove` feature) returns the ExternalProver and
      # shells out to the `r0vm` server. r0vm honors RISC0_DEV_MODE, so the
      # dev-mode test run stays fast — but the binary must be present or
      # proving fails with "No such file or directory". Pinned to the
      # risc0-zkvm version (=3.0.5); bump in lockstep with that pin.
      - name: Install r0vm prover
        timeout-minutes: 10
        run: rzup install r0vm 3.0.5

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny all warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      - name: Build SDK with prover feature
        run: cargo build -p private_multisig_sdk --features prover

      - name: Test SDK with prover feature
        run: cargo test -p private_multisig_sdk --features prover

      # `e2e_tests/` is excluded from the root workspace (its optional
      # `lez-integration` feature pulls the LEZ client stack, which needs
      # logos-blockchain-circuits at build time). The default-feature build
      # has no such prerequisite, so CI runs the Layer A test — three
      # dev-mode approve proofs verified against the pinned image-id, plus
      # the same-member nullifier-replay rejection. Layer B (the full
      # sequencer harness) is gated off and never built here.
      - name: E2E Layer A test (dev-mode proofs)
        run: |
          cargo test --manifest-path e2e_tests/Cargo.toml \
            --test create_propose_approve_execute

      # idl-gen emits the canonical IDL JSON the CLI consumes via spel.toml.
      # The CLI itself is excluded from the workspace because it transitively
      # requires `logos-blockchain-circuits` at build time; CI does not set
      # that up. We regenerate the IDL into a temp file and diff against the
      # committed golden artifact — this catches not just instruction
      # name/count drift but also silent PDA-seed changes, args reshapes,
      # or new accounts being added to a handler, any of which would
      # invalidate the on-chain ABI contract.
      - name: Verify IDL matches committed golden artifact
        run: |
          cargo run -p private_multisig_idl_gen > /tmp/regenerated.idl.json
          diff -u private_multisig.idl.json /tmp/regenerated.idl.json

  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    # cargo-deny runs in seconds; 10 is generous and bounds any hung
    # network call to the RustSec advisory DB.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # `cargo deny check` runs the same RustSec advisory DB as `cargo audit`
      # plus licenses, sources, and bans — one tool, one config (`deny.toml`).
      - name: Check advisories, licenses, sources, and bans
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
